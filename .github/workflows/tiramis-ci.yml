name: TIRAMIS CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/tiramis/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'eslint.config.mjs'
      - 'deploy/tiramis/**'
      - '.github/workflows/tiramis-ci.yml'
      - '.github/workflows/tiramis-deploy-production.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'apps/tiramis/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'eslint.config.mjs'
      - 'deploy/tiramis/**'
      - '.github/workflows/tiramis-ci.yml'
      - '.github/workflows/tiramis-deploy-production.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiramis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate and package TIRAMIS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            package.json
            package-lock.json
            nest-cli.json
            tsconfig.json
            deploy/tiramis/deploy.sh
            deploy/tiramis/ecosystem.config.js
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Required file is missing: $file"
              exit 1
            }
          done

          bash -n deploy/tiramis/deploy.sh
          node --check deploy/tiramis/ecosystem.config.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Run unit tests
        run: npm test -- --runInBand --passWithNoTests

      - name: Build TIRAMIS
        run: npm run build

      - name: Validate build output
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f dist/apps/tiramis/apps/tiramis/src/main.js
          test -f dist/apps/tiramis/apps/tiramis/src/database/data-source.js

      - name: Build production release artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_DIR="$RUNNER_TEMP/tiramis-release"
          ARCHIVE="$RUNNER_TEMP/tiramis-release.tar.gz"
          CHECKSUM="$RUNNER_TEMP/tiramis-release.tar.gz.sha256"

          echo "Preparing release directory"

          rm -rf "$RELEASE_DIR"
          rm -f "$ARCHIVE" "$CHECKSUM"

          mkdir -p "$RELEASE_DIR/deploy/tiramis"

          echo "Copying build output"

          cp -a dist "$RELEASE_DIR/dist"
          cp package.json package-lock.json "$RELEASE_DIR/"

          cp deploy/tiramis/deploy.sh \
            "$RELEASE_DIR/deploy/tiramis/deploy.sh"

          cp deploy/tiramis/ecosystem.config.js \
            "$RELEASE_DIR/deploy/tiramis/ecosystem.config.js"

          chmod 750 \
            "$RELEASE_DIR/deploy/tiramis/deploy.sh"

          printf '%s\n' "$GITHUB_SHA" \
            > "$RELEASE_DIR/REVISION"

          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$RELEASE_DIR/BUILT_AT"

          echo "Creating archive"

          tar -C "$RELEASE_DIR" \
            -czf "$ARCHIVE" .

          test -f "$ARCHIVE"

          echo "Creating portable checksum"

          (
            cd "$RUNNER_TEMP"

            sha256sum tiramis-release.tar.gz \
              > tiramis-release.tar.gz.sha256
          )

          test -f "$CHECKSUM"

          echo "Validating generated checksum"

          (
            cd "$RUNNER_TEMP"
            sha256sum --check tiramis-release.tar.gz.sha256
          )

          echo "Release artifact created successfully"

          ls -lh "$ARCHIVE" "$CHECKSUM"

          echo "Checksum content:"
          cat "$CHECKSUM"

      - name: Upload production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tiramis-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tiramis-release.tar.gz
            ${{ runner.temp }}/tiramis-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0