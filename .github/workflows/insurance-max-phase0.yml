name: Insurance Max Phase 0

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insurance-max-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-all-services:
    name: Validate all three applications
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      NODE_ENV: test
      APP_HOST: 127.0.0.1
      APP_GLOBAL_PREFIX: api
      APP_VERSION: v1
      APP_TIMEZONE: Africa/Dar_es_Salaam

      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SYNCHRONIZE: false
      DB_LOGGING: false
      DB_SSL: false

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      REDIS_DB: 0

      JWT_ACCESS_SECRET: phase0-test-access-secret-must-be-at-least-32
      JWT_REFRESH_SECRET: phase0-test-refresh-secret-must-be-at-least-32
      JWT_RESET_SECRET: phase0-test-reset-secret-must-be-at-least-32

      MAIL_ENABLED: false
      QUEUE_ENABLED: false
      CACHE_ENABLED: false

      TIRAMIS_SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TIRAMIS_TARGET_ENV: test
      TIRAMIS_TEST_BASE_URL: https://tira-test.invalid
      TIRAMIS_LIVE_BASE_URL: https://tira-live.invalid
      TIRAMIS_PORTAL_NOTIFY_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/insurance-portal-web/package-lock.json

      - name: Install backend and TIRAMIS dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --prefix apps/insurance-portal-web --no-audit --no-fund

      - name: Generate route baseline when missing
        shell: bash
        run: |
          test -f docs/generated/phase0-route-inventory.json || {
            echo "Route inventory is missing."
            echo "Run npm run phase0:routes:update and commit the generated file."
            exit 1
          }

      - name: Validate Phase 0 baseline
        run: npm run phase0:validate

      - name: Check formatting
        run: npm run format:check

      - name: Lint all three applications
        run: npm run lint:all

      - name: Test all three applications
        run: npm run test:all

      - name: Build all three applications
        run: npm run build:all

      - name: Verify build output
        run: npm run phase0:verify-build

      - name: Create clean test databases
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE insurance_portal_phase0;'

          psql \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE tiramis_phase0;'

      - name: Run TIRAMIS migrations
        env:
          DB_DATABASE: tiramis_phase0
        run: |
          npm run migration:run:tiramis
          npm run migration:run:tiramis
          npm run migration:show:tiramis

      - name: Run Portal migrations
        env:
          DB_DATABASE: insurance_portal_phase0
        run: |
          npm run migration:run:insurance-portal-service
          npm run migration:run:insurance-portal-service
          npm run migration:show:insurance-portal-service

      - name: Start all three applications
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_NAME="TIRAMIS Service" \
          APP_PORT=9091 \
          APP_URL=http://127.0.0.1:9091 \
          DB_DATABASE=tiramis_phase0 \
          TIRAMIS_TCP_HOST=127.0.0.1 \
          TIRAMIS_TCP_PORT=4001 \
          node \
            dist/apps/tiramis/apps/tiramis/src/main.js \
            > /tmp/tiramis.log 2>&1 &

          echo $! > /tmp/tiramis.pid

          APP_NAME="Insurance Portal Service" \
          APP_PORT=9090 \
          APP_URL=http://127.0.0.1:9090 \
          APP_FRONTEND_URL=http://127.0.0.1:9092 \
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:9092 \
          DB_DATABASE=insurance_portal_phase0 \
          TIRAMIS_SERVICE_BASE_URL=http://127.0.0.1:9091 \
          node \
            dist/apps/insurance-portal-service/apps/insurance-portal-service/src/main.js \
            > /tmp/portal.log 2>&1 &

          echo $! > /tmp/portal.pid

          npm \
            --prefix apps/insurance-portal-web \
            run preview -- \
            --host 127.0.0.1 \
            --port 9092 \
            > /tmp/web.log 2>&1 &

          echo $! > /tmp/web.pid

      - name: Verify all health endpoints
        shell: bash
        run: |
          set -Eeuo pipefail

          wait_for_url() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 40); do
              code="$(
                curl \
                  -sS \
                  -o /tmp/health-response \
                  -w '%{http_code}' \
                  --connect-timeout 2 \
                  --max-time 5 \
                  "$url" || true
              )"

              if [[ "$code" == "200" ]]; then
                echo "$name is healthy: $url"
                cat /tmp/health-response
                echo
                return 0
              fi

              sleep 2
            done

            echo "$name failed health verification: $url"

            cat /tmp/tiramis.log || true
            cat /tmp/portal.log || true
            cat /tmp/web.log || true

            return 1
          }

          wait_for_url \
            "TIRAMIS" \
            "http://127.0.0.1:9091/api/health/ready"

          wait_for_url \
            "Portal Backend" \
            "http://127.0.0.1:9090/api/v1/health/ready"

          wait_for_url \
            "Portal Frontend" \
            "http://127.0.0.1:9092/health.json"

      - name: Stop applications
        if: always()
        shell: bash
        run: |
          for pid_file in \
            /tmp/tiramis.pid \
            /tmp/portal.pid \
            /tmp/web.pid
          do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" || true
            fi
          done
