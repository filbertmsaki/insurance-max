name: Test TIRAMIS Runner

on:
  workflow_dispatch:

jobs:
  test:
    name: Test self-hosted runner

    runs-on:
      - self-hosted
      - linux
      - x64
      - tiramis-self-hosted-runner

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "User: $(whoami)"
          echo "Host: $(hostname)"
          echo "Working directory: $(pwd)"

          node --version
          npm --version
          pm2 --version

      - name: Test deployment permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d /opt/apps/tiramis
          test -w /opt/apps/tiramis/releases
          test -w /opt/apps/tiramis/shared
          test -w /var/log/pm2

          echo "Runner permissions are correct."