name: Insurance Max - Tiramis CI/CD

# ============================================================
# Insurance Max Tiramis CI/CD
#
# App:
#   apps/tiramis
#
# Build runner:
#   GitHub-hosted Ubuntu
#
# Deploy runner:
#   Self-hosted (tiramis-self-hosted-runner)
#
# This file merges what used to be two separate workflows
# (tiramis-ci.yml + tiramis-deploy-production.yml) into one,
# without changing what either job does.
#
# Trigger behavior (unchanged from the two-file setup):
#
#   - push to main          -> build, test, package, then deploy
#                               the artifact produced by that
#                               same run
#   - pull_request           -> build, test, package only
#                               (never deploys)
#   - workflow_dispatch,
#     run_id left blank      -> build, test, package only
#                               (mirrors the old TIRAMIS CI
#                               manual run - no deploy)
#   - workflow_dispatch,
#     run_id filled in       -> deploy only, redeploying the
#                               exact artifact from that earlier
#                               successful run without rebuilding
#                               (mirrors the old TIRAMIS Deploy
#                               Production manual run)
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/tiramis/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'eslint.config.mjs'
      - 'deploy/tiramis/**'
      - '.github/workflows/tiramis-cicd.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'apps/tiramis/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'eslint.config.mjs'
      - 'deploy/tiramis/**'
      - '.github/workflows/tiramis-cicd.yml'

  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          Optional: run ID of a previous successful "Insurance Max - Tiramis CI/CD"
          run to redeploy without rebuilding. Leave blank to build, test,
          package (no deploy).
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  # ==========================================================
  # JOB 1
  #
  # Build, test, package.
  #
  # Skipped only when this run is an explicit redeploy of a
  # previous run (workflow_dispatch with run_id set) - that
  # path deploys an already-built artifact and never rebuilds.
  # ==========================================================
  validate-and-package:
    name: Validate and package TIRAMIS
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: tiramis-ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            package.json
            package-lock.json
            nest-cli.json
            tsconfig.json
            deploy/tiramis/deploy.sh
            deploy/tiramis/ecosystem.config.js
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Required file is missing: $file"
              exit 1
            }
          done

          bash -n deploy/tiramis/deploy.sh
          node --check deploy/tiramis/ecosystem.config.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Run unit tests
        run: npx jest apps/tiramis --runInBand --passWithNoTests

      - name: Build TIRAMIS
        run: npm run build:tiramis

      - name: Validate build output
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f dist/apps/tiramis/apps/tiramis/src/main.js
          test -f dist/apps/tiramis/apps/tiramis/src/database/data-source.js

      - name: Build production release artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_DIR="$RUNNER_TEMP/tiramis-release"
          ARCHIVE="$RUNNER_TEMP/tiramis-release.tar.gz"
          CHECKSUM="$RUNNER_TEMP/tiramis-release.tar.gz.sha256"

          echo "Preparing release directory"

          rm -rf "$RELEASE_DIR"
          rm -f "$ARCHIVE" "$CHECKSUM"

          mkdir -p "$RELEASE_DIR/deploy/tiramis" "$RELEASE_DIR/scripts"

          echo "Copying build output"

          cp -a dist "$RELEASE_DIR/dist"
          cp package.json package-lock.json "$RELEASE_DIR/"

          cp deploy/tiramis/deploy.sh \
            "$RELEASE_DIR/deploy/tiramis/deploy.sh"

          cp deploy/tiramis/ecosystem.config.js \
            "$RELEASE_DIR/deploy/tiramis/ecosystem.config.js"

          cp scripts/create-tiramis-api-key.production.js \
            "$RELEASE_DIR/scripts/create-tiramis-api-key.production.js"

          cp scripts/db-maintenance.js \
            "$RELEASE_DIR/scripts/db-maintenance.js"

          chmod 750 \
            "$RELEASE_DIR/deploy/tiramis/deploy.sh"

          printf '%s\n' "$GITHUB_SHA" \
            > "$RELEASE_DIR/REVISION"

          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$RELEASE_DIR/BUILT_AT"

          echo "Creating archive"

          tar -C "$RELEASE_DIR" \
            -czf "$ARCHIVE" .

          test -f "$ARCHIVE"

          echo "Creating portable checksum"

          (
            cd "$RUNNER_TEMP"

            sha256sum tiramis-release.tar.gz \
              > tiramis-release.tar.gz.sha256
          )

          test -f "$CHECKSUM"

          echo "Validating generated checksum"

          (
            cd "$RUNNER_TEMP"
            sha256sum --check tiramis-release.tar.gz.sha256
          )

          echo "Release artifact created successfully"

          ls -lh "$ARCHIVE" "$CHECKSUM"

          echo "Checksum content:"
          cat "$CHECKSUM"

      - name: Upload production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tiramis-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tiramis-release.tar.gz
            ${{ runner.temp }}/tiramis-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # ==========================================================
  # JOB 2
  #
  # Deploy to production.
  #
  # Runs for:
  #   - push to main, after validate-and-package succeeds in
  #     this same run
  #   - workflow_dispatch with run_id set, deploying that other
  #     run's artifact instead (validate-and-package is skipped)
  #
  # Never runs for pull_request, and never runs for a plain
  # workflow_dispatch with no run_id (that path is build-only).
  # ==========================================================
  deploy:
    name: Deploy TIRAMIS to production
    needs: validate-and-package
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.validate-and-package.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_id != '')
      )

    runs-on:
      - self-hosted
      - linux
      - x64
      - tiramis-self-hosted-runner

    environment: production
    timeout-minutes: 30

    concurrency:
      group: tiramis-production
      cancel-in-progress: false

    env:
      BASE_DIR: /opt/apps/tiramis
      APP_NAME: tiramis
      # GitHub Environment variables can override these defaults when hosts change.
      INTERNAL_HEALTH_URL: ${{ vars.INTERNAL_HEALTH_URL || 'http://127.0.0.1:9090/api/health' }}
      PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://ussdvd.alliance.co.tz/tiramis-api/api/health' }}

    steps:
      - name: Validate deployment URLs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$INTERNAL_HEALTH_URL" ]] || { echo 'Missing GitHub environment variable INTERNAL_HEALTH_URL'; exit 1; }
          [[ -n "$PUBLIC_HEALTH_URL" ]] || { echo 'Missing GitHub environment variable PUBLIC_HEALTH_URL'; exit 1; }

      - name: Resolve and validate CI run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == 'push' ]]; then
            # Deploying the artifact this same run just built - no
            # cross-run lookup needed.
            RUN_ID="$CURRENT_RUN_ID"
            SHA="$CURRENT_SHA"
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && -n "$INPUT_RUN_ID" ]]; then
            RUN_ID="$INPUT_RUN_ID"

            RUN_JSON="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID")"

            export RUN_JSON

            readarray -t RUN_VALUES < <(
              python3 - <<'PY'
          import json
          import os

          run = json.loads(os.environ['RUN_JSON'])

          print(run.get('head_sha', ''))
          print(run.get('head_branch', ''))
          print(run.get('conclusion', ''))
          print(run.get('event', ''))
          print(run.get('name', ''))
          PY
            )

            SHA="${RUN_VALUES[0]}"
            BRANCH="${RUN_VALUES[1]}"
            CONCLUSION="${RUN_VALUES[2]}"
            RUN_EVENT="${RUN_VALUES[3]}"
            WORKFLOW_NAME="${RUN_VALUES[4]}"

            [[ "$BRANCH" == 'main' ]] || {
              echo "Refusing deployment: branch is '$BRANCH', not 'main'."
              exit 1
            }

            [[ "$CONCLUSION" == 'success' ]] || {
              echo "Refusing deployment: conclusion is '$CONCLUSION'."
              exit 1
            }

            [[ "$WORKFLOW_NAME" == 'Insurance Max - Tiramis CI/CD' ]] || {
              echo "Refusing deployment: run belongs to '$WORKFLOW_NAME'."
              exit 1
            }

            [[ "$RUN_EVENT" == 'push' || \
               "$RUN_EVENT" == 'workflow_dispatch' ]] || {
              echo "Refusing deployment: unsupported event '$RUN_EVENT'."
              exit 1
            }
          else
            echo "Refusing deployment: unsupported trigger '$EVENT_NAME' without an explicit run_id."
            exit 1
          fi

          test -n "$RUN_ID"
          test -n "$SHA"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release_id=$SHA" >> "$GITHUB_OUTPUT"

          echo "Selected CI run: $RUN_ID"
          echo "Selected commit: $SHA"

      - name: Download exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: tiramis-release-${{ steps.release.outputs.sha }}
          path: ${{ runner.temp }}/tiramis-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Validate and extract artifact
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail

          ARTIFACT_DIR="$RUNNER_TEMP/tiramis-artifact"
          ARCHIVE="$ARTIFACT_DIR/tiramis-release.tar.gz"
          CHECKSUM="$ARTIFACT_DIR/tiramis-release.tar.gz.sha256"
          EXTRACT_DIR="$RUNNER_TEMP/tiramis-release"

          test -f "$ARCHIVE"
          test -f "$CHECKSUM"

          cd "$ARTIFACT_DIR"
          sha256sum --check tiramis-release.tar.gz.sha256

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"

          test -f "$EXTRACT_DIR/package.json"
          test -f "$EXTRACT_DIR/package-lock.json"
          test -f "$EXTRACT_DIR/REVISION"

          test -f \
            "$EXTRACT_DIR/deploy/tiramis/deploy.sh"

          test -f \
            "$EXTRACT_DIR/deploy/tiramis/ecosystem.config.js"

          test -f \
            "$EXTRACT_DIR/dist/apps/tiramis/apps/tiramis/src/main.js"

          test -f \
            "$EXTRACT_DIR/dist/apps/tiramis/apps/tiramis/src/database/data-source.js"

          [[ "$(cat "$EXTRACT_DIR/REVISION")" == "$EXPECTED_SHA" ]] || {
            echo 'Artifact revision does not match the requested commit.'
            exit 1
          }

          bash -n \
            "$EXTRACT_DIR/deploy/tiramis/deploy.sh"

          node --check \
            "$EXTRACT_DIR/deploy/tiramis/ecosystem.config.js"

      - name: Prepare deployment directories
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$BASE_DIR/releases" \
            "$BASE_DIR/shared" \
            "$BASE_DIR/certificates" \
            /var/log/pm2

          test -w "$BASE_DIR/releases"
          test -w "$BASE_DIR/shared"
          test -w /var/log/pm2

      - name: Install deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE="$RUNNER_TEMP/tiramis-release"

          install -m 750 \
            "$RELEASE/deploy/tiramis/deploy.sh" \
            "$BASE_DIR/shared/deploy.sh"

          install -m 640 \
            "$RELEASE/deploy/tiramis/ecosystem.config.js" \
            "$BASE_DIR/shared/ecosystem.config.js"

          test -f "$BASE_DIR/shared/.env" || {
            echo "Missing environment file: $BASE_DIR/shared/.env"
            exit 1
          }

      - name: Install release files
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -Eeuo pipefail

          SOURCE="$RUNNER_TEMP/tiramis-release"
          RELEASE_DIR="$BASE_DIR/releases/$RELEASE_ID"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp -a "$SOURCE/." "$RELEASE_DIR/"

          test -f "$RELEASE_DIR/REVISION"

          test "$(cat "$RELEASE_DIR/REVISION")" = "$RELEASE_ID"

      - name: Deploy release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          HEALTH_URL: ${{ env.INTERNAL_HEALTH_URL }}
          KEEP_RELEASES: '5'
        run: |
          set -Eeuo pipefail

          "$BASE_DIR/shared/deploy.sh" "$RELEASE_ID"

      - name: Verify internal health
        shell: bash
        run: |
          set -Eeuo pipefail

          code="$(curl -sS \
            -o /dev/null \
            -w '%{http_code}' \
            --connect-timeout 3 \
            --max-time 10 \
            "$INTERNAL_HEALTH_URL" || true)"

          [[ "$code" == '200' ]] || {
            echo "Internal health check failed with HTTP $code"

            pm2 logs "$APP_NAME" \
              --lines 120 \
              --nostream || true

            exit 1
          }

      - name: Verify Apache reverse proxy
        shell: bash
        run: |
          set -Eeuo pipefail

          code="$(curl -ksS \
            -o /dev/null \
            -w '%{http_code}' \
            --connect-timeout 5 \
            --max-time 15 \
            --resolve ussdvd.alliance.co.tz:443:127.0.0.1 \
            "$PUBLIC_HEALTH_URL" || true)"

          [[ "$code" == '200' ]] || {
            echo "Apache reverse-proxy health check failed with HTTP $code"
            exit 1
          }

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## TIRAMIS production deployment'
            echo
            echo '- Commit: `${{ steps.release.outputs.sha }}`'
            echo '- CI run: `${{ steps.release.outputs.run_id }}`'
            echo '- Runner: `${{ runner.name }}`'
            echo "- Server: \`$(hostname)\`"
            echo "- Internal: \`$INTERNAL_HEALTH_URL\`"
            echo "- Public: \`$PUBLIC_HEALTH_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show diagnostic logs after failure
        if: failure()
        shell: bash
        run: |
          pm2 status || true

          pm2 logs "$APP_NAME" \
            --lines 150 \
            --nostream || true
