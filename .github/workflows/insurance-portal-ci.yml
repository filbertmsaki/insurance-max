name: Insurance Portal CI

on:
  push:
    branches:
      - main
      - uat
    paths:
      - 'apps/insurance-portal-service/**'
      - 'apps/insurance-portal-web/**'
      - 'libs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'eslint.config.mjs'
      - '.github/workflows/insurance-portal-ci.yml'
  pull_request:
    branches:
      - main
      - uat
    paths:
      - 'apps/insurance-portal-service/**'
      - 'apps/insurance-portal-web/**'
      - 'libs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'eslint.config.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insurance-portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurance_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: insurance_portal_ci
      DB_NAME: insurance_portal_ci
      DB_SCHEMA: public
      DB_SYNCHRONIZE: 'false'
      DB_SSL: 'false'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix apps/insurance-portal-web ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Backend lint
        run: npm run lint:backend -- --max-warnings=0

      - name: Frontend lint
        run: npm run lint:web

      - name: Run portal migrations
        run: npm run migration:run:insurance-portal-service

      - name: Verify no pending migration
        run: npm run migration:show:insurance-portal-service

      - name: Policy and endorsement unit tests
        run: npm run test:policy-endorsement

      - name: Frontend tests
        run: npm run test:web

      - name: Build portal backend
        run: npm run build:insurance-portal-service

      - name: Build portal frontend
        run: npm run build:insurance-portal-web

      - name: Validate database invariants
        run: npm run validate:policy-endorsement-db
