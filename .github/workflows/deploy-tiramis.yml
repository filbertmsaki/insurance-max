name: Deploy tiramis

on:
  push:
    branches: [main]
    paths:
      - 'apps/tiramis/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-tiramis.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tiramis
        run: npm run build

      # Only the compiled output + manifest files leave this job — no other
      # app's source, no tests, no .git history, no dev tooling.
      - name: Stage release artifact
        run: |
          mkdir -p release/dist/apps/tiramis
          cp -r dist/apps/tiramis/. release/dist/apps/tiramis/
          cp package.json package-lock.json release/

      - name: Set release id
        id: release
        run: echo "id=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TIRAMIS_DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.TIRAMIS_DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          ssh ${{ secrets.TIRAMIS_DEPLOY_USER }}@${{ secrets.TIRAMIS_DEPLOY_HOST }} \
            "mkdir -p /opt/apps/tiramis/releases/${{ steps.release.outputs.id }}"
          rsync -az --delete release/ \
            ${{ secrets.TIRAMIS_DEPLOY_USER }}@${{ secrets.TIRAMIS_DEPLOY_HOST }}:/opt/apps/tiramis/releases/${{ steps.release.outputs.id }}/

      - name: Run remote deploy script
        run: |
          ssh ${{ secrets.TIRAMIS_DEPLOY_USER }}@${{ secrets.TIRAMIS_DEPLOY_HOST }} \
            "/opt/apps/tiramis/shared/deploy.sh ${{ steps.release.outputs.id }}"
